# Tests must not touch the file database the dev server is holding open. Sharing it
# makes the suite fail intermittently whenever bootRun happens to be running.
spring.datasource.url=jdbc:h2:mem:battleroyal-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# This file shadows the main application.properties entirely, so the Google client has
# to be registered here too. Placeholder values: tests sign in through spring-security-test.
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=openid
