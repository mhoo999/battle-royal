# Production profile: run with SPRING_PROFILES_ACTIVE=prod on EC2.
# Everything secret or environment-specific comes from environment variables, which the
# systemd unit loads from /etc/battle-royal/env. Nothing here is a secret.

# RDS for MySQL. Only results and rankings are written; never per-tick state.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# One writer thread saves results; a small pool is plenty and stays inside the
# connection limit of a micro RDS instance.
spring.datasource.hikari.maximum-pool-size=5

# One table, created on first boot. Revisit with a migration tool when the schema
# starts changing under live data.
spring.jpa.hibernate.ddl-auto=update

# The H2 console is a development tool and must never be reachable in production.
spring.h2.console.enabled=false

# Nginx terminates HTTP(S) in front of the app and forwards the original host and
# scheme, which the same-origin WebSocket check relies on.
server.address=127.0.0.1
server.forward-headers-strategy=native

# Behind HTTPS the session cookie never travels over plain HTTP.
server.servlet.session.cookie.secure=true

# On deploy, stop taking new requests and let in-flight ones finish.
server.shutdown=graceful

# Server-run players keep a lone player company: people and bots together make 4 while
# anyone is on the island (docs/GAME_RULES.md §10c). Off elsewhere, so tests and CI see
# only their own players.
game.bots.target=4
