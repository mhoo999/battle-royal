spring.application.name=battle-royal

# Real-time state lives in memory; the DB only ever holds results and rankings.
spring.datasource.url=jdbc:h2:file:./data/battleroyal;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Google sign-in. Only the openid scope: the game needs Google's subject id and nothing
# else, so no email or profile is ever requested or stored. The credentials come from the
# environment; without them the app still starts and guests play, but sign-in fails.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=openid

# A cross-site form cannot carry the session into a POST (CSRF tokens are off).
server.servlet.session.cookie.same-site=lax

# Snapshots are small and frequent; do not pretty-print them.
spring.jackson.default-property-inclusion=always

logging.level.com.example.battleroyal=INFO
