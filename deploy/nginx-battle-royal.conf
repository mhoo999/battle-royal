# Nginx site for the game server. The app listens on 127.0.0.1:8080 only; Nginx is the
# one thing facing the internet.
#
# This is the file as it stands on the server: HTTPS on 443 with a Let's Encrypt
# certificate, and port 80 sending everyone to https. The certificate lines were written
# by certbot and point at files only certbot creates, so on a fresh server:
#   1. install this file with the 443 server's ssl_* and include lines and the whole
#      port-80 server removed, and "listen 80;" in place of "listen 443 ssl;"
#   2. sudo certbot --nginx -d battleroyale.site -d www.battleroyale.site --redirect
# certbot then puts back what you removed. See docs/AWS_DEPLOYMENT.md §5.

# WebSocket upgrade: pass "Upgrade" through when the client asks, "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name battleroyale.site www.battleroyale.site;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The app accepts same-origin WebSockets only: the browser's Origin must equal
        # the scheme, host and port the app believes it was reached on. Tomcat takes
        # the host from Host and, with server.forward-headers-strategy=native, the
        # scheme and port from X-Forwarded-Proto/-Port. Without -Port it assumes 80
        # for http, so on any other port a browser's handshake fails with 403 while
        # Node clients, which send no Origin, still pass. Found testing locally.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Snapshots are only sent when something changes, so a quiet player's socket
        # can sit silent for a long time. Nginx's default 60s would cut it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/battleroyale.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/battleroyale.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP only redirects. Certificate renewal still works through it: certbot's
# nginx plugin answers its own challenge. A request by bare IP matches neither name and
# gets the 404.
server {
    if ($host = www.battleroyale.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = battleroyale.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name battleroyale.site www.battleroyale.site;
    return 404; # managed by Certbot
}
